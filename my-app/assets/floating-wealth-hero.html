<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating cards & coins — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,560;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg-0:#030509;
    --bg-1:#0A1120;
    --bg-2:#111C36;
    --cream:#F4EFE8;
    --cream-dim:#AEB6C9;
    --gold:#F0C24C;
    --gold-dim:#A9761E;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg-0); }
  body{
    font-family:'Manrope', sans-serif;
    color:var(--cream);
    overflow-x:hidden;
  }

  /* ===================== SCENE ===================== */
  .scene{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 78%);
  }
  .scene::after{
    /* cinematic vignette */
    content:'';
    position:absolute; inset:0;
    pointer-events:none;
    box-shadow: inset 0 0 22vw rgba(0,0,0,.85);
    z-index:9;
  }

  /* ---------- starfield particles ---------- */
  .particles{ position:absolute; inset:0; z-index:1; }
  .particle{
    position:absolute;
    border-radius:50%;
    background:#BFD0FF;
    animation:twinkle var(--tw,4s) ease-in-out infinite, drift var(--pd,50s) linear infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:var(--op-lo,.15); }
    50%{ opacity:var(--op-hi,.75); }
  }
  @keyframes drift{
    0%{ transform:translateY(6vh); }
    100%{ transform:translateY(-106vh); }
  }

  /* ---------- floaters layer (masked fade top/bottom) ---------- */
  .floaters{
    position:absolute; inset:0;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
  }
  .floater{
    position:absolute;
    bottom:-20%;
    left:var(--left, 50%);
    perspective:900px;
    animation:floatUp var(--dur,18s) linear var(--delay,0s) infinite;
    z-index:var(--z,4);
  }
  @keyframes floatUp{
    0%   { transform:translate(-50%,0) translateX(0); opacity:0; }
    8%   { opacity:1; }
    50%  { transform:translate(-50%,-64vh) translateX(var(--sway,16px)); }
    92%  { opacity:1; }
    100% { transform:translate(-50%,-132vh) translateX(0); opacity:0; }
  }

  .depth-far  .visual{ filter:none; }
  .depth-near .visual{ filter:none; }
  .depth-blur .visual{ filter:blur(1.5px); }

  /* ===================== CARDS ===================== */
  .card-tumble{
    animation:tumble var(--tumbleDur,7s) ease-in-out infinite;
    transform-style:preserve-3d;
  }
  @keyframes tumble{
    0%   { transform:rotateX(-9deg) rotateY(-18deg) rotateZ(-3deg); }
    50%  { transform:rotateX(9deg)  rotateY(18deg)  rotateZ(3deg); }
    100% { transform:rotateX(-9deg) rotateY(-18deg) rotateZ(-3deg); }
  }

  .card{
    width:190px; height:119px;
    border-radius:16px;
    position:relative;
    padding:15px 16px;
    display:flex; flex-direction:column; justify-content:space-between;
    overflow:hidden;
  }
  .card::before{
    /* glossy diagonal sheen */
    content:'';
    position:absolute; inset:-40% -10%;
    background:linear-gradient(115deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.35) 48%, rgba(255,255,255,0) 56%);
    animation:sheen 6s ease-in-out infinite;
  }
  @keyframes sheen{
    0%,100%{ transform:translateX(-30%); opacity:.5; }
    50%{ transform:translateX(30%); opacity:1; }
  }

  .card--cyan{
    background:linear-gradient(135deg, #6FEFF2 0%, #2E86E8 55%, #123C93 100%);
    box-shadow:0 0 50px -6px rgba(80,200,230,.45), 0 20px 40px -18px rgba(0,0,0,.6);
  }
  .card--violet{
    background:linear-gradient(135deg, #D689F5 0%, #8A4CE0 55%, #3E1E8C 100%);
    box-shadow:0 0 50px -6px rgba(160,110,235,.45), 0 20px 40px -18px rgba(0,0,0,.6);
  }
  .card--dark{
    background:
      repeating-linear-gradient(115deg, rgba(90,160,255,.14) 0 1px, transparent 1px 26px),
      linear-gradient(155deg, #12203C 0%, #060B16 80%);
    border:1px solid rgba(110,170,255,.22);
    box-shadow:0 0 40px -8px rgba(70,140,255,.35), 0 20px 40px -18px rgba(0,0,0,.7);
  }

  .card-row{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2; }
  .card-chip{
    width:24px; height:18px; border-radius:4px;
    background:linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.4));
  }
  .card--dark .card-chip{ background:linear-gradient(135deg, rgba(140,190,255,.55), rgba(140,190,255,.15)); }
  .card-mark{ opacity:.85; color:#fff; }
  .card-bars{ position:relative; z-index:2; display:flex; flex-direction:column; gap:6px; }
  .bar{ height:6px; border-radius:3px; background:rgba(255,255,255,.35); }
  .bar.short{ width:46%; background:rgba(255,255,255,.22); }
  .bar.long{ width:72%; }

  /* ===================== COINS ===================== */
  .coin-spin{
    animation:coinSpin var(--spinDur,4s) linear infinite;
    transform-style:preserve-3d;
  }
  @keyframes coinSpin{
    0%{ transform:rotateY(0deg) rotateX(10deg); }
    100%{ transform:rotateY(360deg) rotateX(10deg); }
  }
  .coin{
    border-radius:50%;
    background:radial-gradient(circle at 35% 28%, #FCEDB0 0%, #F0C24C 45%, #A9761E 100%);
    box-shadow:0 0 26px rgba(240,194,76,.55), inset 0 0 0 1px rgba(255,255,255,.35);
    position:relative;
  }
  .coin::after{
    content:'';
    position:absolute; inset:22%;
    border-radius:50%;
    border:1.5px solid rgba(90,62,10,.4);
  }

  /* ===================== HERO TEXT ===================== */
  .hero-copy{
    position:relative; z-index:6;
    text-align:center;
    max-width:640px;
    padding:0 24px;
  }
  .eyebrow{
    font-family:'Manrope', sans-serif;
    font-size:.76rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold);
    margin-bottom:20px;
  }
  .headline{
    font-family:'Fraunces', serif;
    font-weight:560;
    font-size:clamp(2.4rem, 5vw, 3.8rem);
    line-height:1.06;
    letter-spacing:-.01em;
    margin:0 0 20px;
  }
  .headline em{ font-style:italic; color:var(--gold); font-weight:500; }
  .subhead{
    font-size:1.05rem; line-height:1.6; color:var(--cream-dim);
    margin:0 auto 34px; max-width:44ch;
  }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    background:linear-gradient(135deg, #FCEDB0, var(--gold) 70%);
    color:#241B08; font-weight:700; font-size:.98rem;
    padding:15px 28px; border-radius:999px;
    text-decoration:none;
    box-shadow:0 20px 40px -16px rgba(240,194,76,.5);
    transition:transform .25s ease;
  }
  .btn:hover{ transform:translateY(-2px); }

  @media (max-width:640px){
    .card{ width:150px; height:94px; padding:12px; }
    .bar{ height:5px; }
  }

  @media (prefers-reduced-motion: reduce){
    .particle, .floater, .card-tumble, .coin-spin, .card::before{
      animation-play-state: paused !important;
    }
  }
</style>
</head>
<body>

<section class="scene" id="scene">

  <div class="particles" id="particles"></div>

  <div class="floaters" id="floaters"></div>


</section>

<script>
(function(){
  var floaters = document.getElementById('floaters');
  var particlesEl = document.getElementById('particles');

  function rand(min, max){ return Math.random() * (max - min) + min; }

  // ---------- cards (fixed trio, randomized timing/position) ----------
  var cardConfigs = [
    { variant:'cyan',   left:24, dur:17, delay:-3,  tumbleDur:7.5, depth:'near' },
    { variant:'violet', left:64, dur:20, delay:-11, tumbleDur:8.6, depth:'near' },
    { variant:'dark',   left:44, dur:23, delay:-16, tumbleDur:9.4, depth:'far'  }
  ];

  cardConfigs.forEach(function(cfg){
    var floater = document.createElement('div');
    floater.className = 'floater depth-' + cfg.depth;
    floater.style.setProperty('--left', cfg.left + '%');
    floater.style.setProperty('--dur', cfg.dur + 's');
    floater.style.setProperty('--delay', cfg.delay + 's');
    floater.style.setProperty('--sway', rand(-24,24).toFixed(0) + 'px');
    floater.style.setProperty('--z', cfg.depth === 'near' ? 6 : 2);
    if (cfg.depth === 'far') floater.style.transform = 'scale(.66)';

    var tumble = document.createElement('div');
    tumble.className = 'card-tumble';
    tumble.style.setProperty('--tumbleDur', cfg.tumbleDur + 's');

    var visual = document.createElement('div');
    visual.className = 'visual card card--' + cfg.variant;
    visual.innerHTML =
      '<div class="card-row">' +
        '<div class="card-chip"></div>' +
        '<svg class="card-mark" width="20" height="12" viewBox="0 0 40 24" fill="none">' +
          '<circle cx="14" cy="12" r="10" stroke="currentColor" stroke-width="2.4"/>' +
          '<circle cx="26" cy="12" r="10" stroke="currentColor" stroke-width="2.4"/>' +
        '</svg>' +
      '</div>' +
      '<div class="card-bars">' +
        '<div class="bar long"></div>' +
        '<div class="bar short"></div>' +
      '</div>';

    tumble.appendChild(visual);
    floater.appendChild(tumble);
    floaters.appendChild(floater);
  });

  // ---------- coins (randomized swarm) ----------
  var coinCount = 10;
  for (var i = 0; i < coinCount; i++){
    var size  = rand(16, 36);
    var depth = size > 27 ? 'near' : 'far';
    var floater = document.createElement('div');
    floater.className = 'floater depth-' + depth + (size > 30 ? ' depth-blur' : '');
    floater.style.setProperty('--left', rand(6, 94).toFixed(1) + '%');
    floater.style.setProperty('--dur', rand(11, 19).toFixed(1) + 's');
    floater.style.setProperty('--delay', (-rand(0, 18)).toFixed(1) + 's');
    floater.style.setProperty('--sway', rand(-30,30).toFixed(0) + 'px');
    floater.style.setProperty('--z', depth === 'near' ? 7 : 3);

    var spin = document.createElement('div');
    spin.className = 'coin-spin';
    spin.style.setProperty('--spinDur', rand(3, 6.5).toFixed(1) + 's');

    var coin = document.createElement('div');
    coin.className = 'visual coin';
    coin.style.width = size + 'px';
    coin.style.height = size + 'px';

    spin.appendChild(coin);
    floater.appendChild(spin);
    floaters.appendChild(floater);
  }

  // ---------- starfield ----------
  var starCount = 55;
  for (var s = 0; s < starCount; s++){
    var star = document.createElement('div');
    star.className = 'particle';
    var sz = rand(1, 2.6);
    star.style.width = sz + 'px';
    star.style.height = sz + 'px';
    star.style.left = rand(0, 100) + '%';
    star.style.top = rand(0, 100) + '%';
    star.style.setProperty('--tw', rand(3, 7).toFixed(1) + 's');
    star.style.setProperty('--pd', rand(40, 90).toFixed(0) + 's');
    star.style.setProperty('--op-hi', rand(.4, .9).toFixed(2));
    star.style.animationDelay = (-rand(0, 40)).toFixed(1) + 's, ' + (-rand(0, 60)).toFixed(1) + 's';
    particlesEl.appendChild(star);
  }

  // ---------- gentle parallax on pointer ----------
  if (window.matchMedia('(hover:hover)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var scene = document.getElementById('scene');
    scene.addEventListener('mousemove', function(e){
      var r = scene.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - .5;
      var py = (e.clientY - r.top) / r.height - .5;
      floaters.style.transform = 'translate(' + (px * -14) + 'px,' + (py * -10) + 'px)';
    });
    scene.addEventListener('mouseleave', function(){
      floaters.style.transform = 'translate(0,0)';
    });
  }
})();
</script>

</body>
</html>
